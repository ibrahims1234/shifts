<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shifts</title>
<meta name="theme-color" content="#172520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shifts">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #172520;
    --panel: #1F3029;
    --line: #2C4137;
    --text: #ECE6D3;
    --muted: #8FA397;
    --gold: #D9B45B;
    --gold-ink: #251E0C;
    --danger: #E08A72;
    --display: "Bricolage Grotesque", -apple-system, system-ui, sans-serif;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: var(--ui);
    font-variant-numeric: tabular-nums;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .app { max-width: 460px; margin: 0 auto; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-name { font-size: 17px; font-weight: 600; min-width: 140px; text-align: center; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--muted); }
  .icon-btn:active { background: var(--panel); }
  .icon-btn svg { width: 22px; height: 22px; }

  /* Payout figure */
  .payout { padding: 20px 4px 22px; }
  .payout-label { color: var(--muted); font-size: 15px; }
  .payout-figure {
    font-family: var(--display);
    font-variation-settings: "opsz" 96;
    font-weight: 700;
    font-size: clamp(56px, 18vw, 76px);
    line-height: 1;
    letter-spacing: -0.035em;
    color: var(--gold);
    margin-top: 6px;
  }
  .payout-figure .pence { font-size: 0.45em; letter-spacing: 0; color: var(--muted); font-weight: 500; }

  /* Calendar */
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weekdays { margin-bottom: 6px; }
  .weekdays span { text-align: center; font-size: 12px; color: var(--muted); }
  .day {
    position: relative;
    aspect-ratio: 1 / 1.15;
    border-radius: 10px;
    background: var(--panel);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 6px 0 6px 7px;
    text-align: left;
    overflow: hidden;
  }
  .day.blank { background: transparent; pointer-events: none; }
  .day .num { font-size: 14px; font-weight: 500; }
  .day .amt { font-size: 11px; font-weight: 600; letter-spacing: -0.01em; }
  .day.future:not(.worked) .num { color: var(--muted); }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--text); }
  .day.worked { color: var(--gold-ink); }
  .day:active { transform: scale(0.94); }
  @media (prefers-reduced-motion: no-preference) { .day { transition: transform .12s ease; } }

  /* Summary */
  .summary { margin-top: 24px; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .row dt { color: var(--muted); }
  .row dd { margin: 0; font-weight: 600; }
  .hint { color: var(--muted); font-size: 14px; text-align: center; margin: 22px 0 0; }

  /* Sheet */
  .scrim { position: fixed; inset: 0; background: rgba(5, 10, 8, .55); opacity: 0; pointer-events: none; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-width: 460px; margin: 0 auto;
    background: var(--panel);
    border-radius: 20px 20px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%);
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: translateY(0); }
  @media (prefers-reduced-motion: no-preference) {
    .scrim { transition: opacity .25s ease; }
    .sheet { transition: transform .32s cubic-bezier(.2, .9, .25, 1); }
  }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { font-family: var(--display); font-weight: 500; font-size: 26px; letter-spacing: -0.02em; margin: 0 0 20px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .step { width: 52px; height: 52px; border-radius: 14px; background: var(--bg); font-size: 26px; line-height: 1; flex: none; }
  .step:active { background: var(--line); }
  .input-wrap { flex: 1; position: relative; }
  .input-wrap .prefix, .input-wrap .suffix { position: absolute; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; pointer-events: none; }
  .input-wrap .prefix { left: 16px; }
  .input-wrap .suffix { right: 16px; }
  .sheet input {
    width: 100%; height: 52px; border-radius: 14px; border: 0;
    background: var(--bg); color: var(--text);
    font: 600 22px var(--ui); font-variant-numeric: tabular-nums;
    text-align: center; padding: 0 44px;
  }
  .rate-input input { text-align: left; padding-left: 36px; }
  .day-total { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px 20px; font-size: 16px; color: var(--muted); }
  .day-total strong { color: var(--gold); font-size: 22px; font-weight: 700; }
  .actions { display: flex; gap: 10px; }
  .btn { flex: 1; height: 54px; border-radius: 14px; font-weight: 600; font-size: 17px; }
  .btn-primary { background: var(--gold); color: var(--gold-ink); }
  .btn-primary:active { filter: brightness(.9); }
  .btn-quiet { flex: 0 0 auto; padding: 0 20px; background: var(--bg); color: var(--danger); }
  .btn-plain { background: var(--bg); }
  .note { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 4px 0 18px; }
  .settings-btns { display: grid; gap: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--text); color: var(--bg); font-weight: 600; font-size: 15px;
    padding: 12px 18px; border-radius: 12px; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s, transform .2s; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="month-nav">
      <button class="icon-btn" id="prev" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="month-name" id="monthName" aria-label="Go to this month"></button>
      <button class="icon-btn" id="next" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>

  <section class="payout" aria-live="polite">
    <div class="payout-label" id="payoutLabel"></div>
    <div class="payout-figure" id="payoutFigure"></div>
  </section>

  <div class="weekdays" aria-hidden="true">
    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
  </div>
  <div class="grid" id="grid"></div>

  <dl class="summary" id="summary"></dl>
  <p class="hint" id="hint" hidden>Tap a day to log your hours.</p>
</div>

<!-- Day sheet -->
<div id="daySheetWrap">
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
    <div class="grabber"></div>
    <h2 id="dayTitle"></h2>
    <div class="field">
      <label for="hours">Hours</label>
      <div class="stepper">
        <button class="step" id="hMinus" aria-label="Half an hour less">−</button>
        <div class="input-wrap">
          <input id="hours" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          <span class="suffix">h</span>
        </div>
        <button class="step" id="hPlus" aria-label="Half an hour more">+</button>
      </div>
    </div>
    <div class="field">
      <label for="rate">Hourly rate</label>
      <div class="input-wrap rate-input">
        <span class="prefix">£</span>
        <input id="rate" type="text" inputmode="decimal" autocomplete="off">
      </div>
    </div>
    <div class="day-total"><span>For this day</span><strong id="dayTotal">£0.00</strong></div>
    <div class="actions">
      <button class="btn btn-quiet" id="removeDay">Remove</button>
      <button class="btn btn-primary" id="saveDay">Save</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div id="settingsWrap">
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="grabber"></div>
    <h2 id="settingsTitle">Settings</h2>
    <div class="field">
      <label for="defaultRate">Default hourly rate</label>
      <div class="input-wrap rate-input">
        <span class="prefix">£</span>
        <input id="defaultRate" type="text" inputmode="decimal" autocomplete="off">
      </div>
    </div>
    <p class="note">New days start at this rate. Days you've already logged keep their own rate.</p>
    <div class="settings-btns">
      <button class="btn btn-plain" id="exportBtn">Save a backup</button>
      <button class="btn btn-plain" id="importBtn">Restore from backup</button>
      <button class="btn btn-primary" id="saveSettings">Done</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const KEY = 'shifts.v1';
  const $ = id => document.getElementById(id);

  // ---------- Storage ----------
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && typeof d === 'object' && d.days) return { rate: Number(d.rate) || 15, days: d.days };
    } catch (e) {}
    return { rate: 15, days: {} };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Couldn’t save. Check Safari storage settings.'); }
  }
  let state = load();

  // ---------- Helpers ----------
  const pad = n => String(n).padStart(2, '0');
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
  const gbp0 = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', maximumFractionDigits: 0 });
  const money = n => gbp.format(n);
  const round2 = n => Math.round(n * 100) / 100;
  const parseNum = s => {
    const n = parseFloat(String(s).replace(',', '.').replace(/[^\d.]/g, ''));
    return Number.isFinite(n) ? n : NaN;
  };
  const fmtHours = h => (Math.round(h * 100) / 100).toString();
  const monthFmt = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' });
  const dayFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  const now = new Date();
  const today = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
  let view = { y: today.y, m: today.m };

  function cmpMonth(y, m) { // -1 past, 0 current, 1 future
    if (y < today.y || (y === today.y && m < today.m)) return -1;
    if (y === today.y && m === today.m) return 0;
    return 1;
  }

  // ---------- Render ----------
  function render() {
    const { y, m } = view;
    const first = new Date(y, m, 1);
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7; // Monday first
    const rel = cmpMonth(y, m);

    $('monthName').textContent = monthFmt.format(first);

    // Calendar
    const grid = $('grid');
    grid.innerHTML = '';
    for (let i = 0; i < lead; i++) {
      const b = document.createElement('div');
      b.className = 'day blank';
      grid.appendChild(b);
    }
    let totalHours = 0, totalPay = 0, earnedSoFar = 0, daysWorked = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const k = keyOf(y, m, d);
      const e = state.days[k];
      const isToday = rel === 0 && d === today.d;
      const isFuture = rel === 1 || (rel === 0 && d > today.d);
      const btn = document.createElement('button');
      btn.className = 'day' + (isToday ? ' today' : '') + (isFuture ? ' future' : '');
      btn.dataset.day = d;
      let label = dayFmt.format(new Date(y, m, d));
      let amt = '';
      if (e && e.h > 0) {
        const pay = e.h * e.r;
        totalHours += e.h; totalPay += pay; daysWorked++;
        if (!isFuture) earnedSoFar += pay;
        btn.classList.add('worked');
        // Deeper gold for longer days: 2h is pale, 10h+ is full.
        const a = Math.min(1, 0.45 + (e.h / 10) * 0.55);
        btn.style.background = `rgba(217, 180, 91, ${a.toFixed(2)})`;
        if (a < 0.7) btn.style.color = 'var(--text)';
        amt = gbp0.format(pay);
        label += `, ${fmtHours(e.h)} hours, ${money(pay)}`;
      }
      btn.setAttribute('aria-label', label);
      btn.innerHTML = `<span class="num">${d}</span><span class="amt">${amt}</span>`;
      grid.appendChild(btn);
    }

    // Headline figure
    let figure, labelText;
    if (rel === -1) {
      figure = totalPay;
      labelText = `Paid at the end of ${monthFmt.format(first).split(' ')[0]}`;
    } else if (rel === 0) {
      const pace = today.d > 0 ? (earnedSoFar / today.d) * daysInMonth : 0;
      figure = Math.max(pace, totalPay);
      labelText = `Projected payout, ${daysInMonth} ${monthFmt.format(first).split(' ')[0]}`;
    } else {
      figure = totalPay;
      labelText = 'Logged ahead for this month';
    }
    $('payoutLabel').textContent = labelText;
    const [pounds, pence] = money(round2(figure)).split('.');
    $('payoutFigure').innerHTML = `${pounds}<span class="pence">.${pence}</span>`;

    // Summary
    const rows = [['Hours worked', `${fmtHours(totalHours)} h`], ['Days worked', String(daysWorked)]];
    if (rel === 0) {
      rows.push(['Earned so far', money(earnedSoFar)]);
      if (totalPay > earnedSoFar) rows.push(['Including upcoming shifts', money(totalPay)]);
    } else {
      rows.push(['Total earned', money(totalPay)]);
    }
    $('summary').innerHTML = rows.map(([a, b]) => `<div class="row"><dt>${a}</dt><dd>${b}</dd></div>`).join('');
    $('hint').hidden = daysWorked > 0;
  }

  // ---------- Sheets ----------
  function openSheet(wrap) { wrap.classList.add('open'); }
  function closeSheet(wrap) { wrap.classList.remove('open'); document.activeElement && document.activeElement.blur(); }
  document.querySelectorAll('[data-close]').forEach(s => s.addEventListener('click', () => closeSheet(s.parentElement)));

  // Swipe sheet down to close
  document.querySelectorAll('.sheet').forEach(sheet => {
    let startY = null;
    sheet.addEventListener('touchstart', e => { if (e.target.tagName !== 'INPUT') startY = e.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchend', e => {
      if (startY !== null && e.changedTouches[0].clientY - startY > 70) closeSheet(sheet.parentElement);
      startY = null;
    });
  });

  // Day sheet
  const dayWrap = $('daySheetWrap');
  let editing = null;

  function updateDayTotal() {
    const h = parseNum($('hours').value), r = parseNum($('rate').value);
    $('dayTotal').textContent = money(h > 0 && r >= 0 ? h * r : 0);
  }
  function openDay(d) {
    editing = keyOf(view.y, view.m, d);
    const e = state.days[editing];
    $('dayTitle').textContent = dayFmt.format(new Date(view.y, view.m, d));
    $('hours').value = e ? fmtHours(e.h) : '';
    $('rate').value = (e ? e.r : state.rate).toFixed(2);
    $('removeDay').hidden = !e;
    updateDayTotal();
    openSheet(dayWrap);
  }
  $('grid').addEventListener('click', ev => {
    const b = ev.target.closest('.day[data-day]');
    if (b) openDay(Number(b.dataset.day));
  });
  function stepHours(delta) {
    const cur = parseNum($('hours').value) || 0;
    const next = Math.max(0, Math.min(24, Math.round((cur + delta) * 2) / 2));
    $('hours').value = fmtHours(next);
    updateDayTotal();
  }
  $('hMinus').addEventListener('click', () => stepHours(-0.5));
  $('hPlus').addEventListener('click', () => stepHours(0.5));
  $('hours').addEventListener('input', updateDayTotal);
  $('rate').addEventListener('input', updateDayTotal);

  $('saveDay').addEventListener('click', () => {
    const h = parseNum($('hours').value), r = parseNum($('rate').value);
    if (!(h > 0)) { toast('Enter the hours you worked'); return; }
    if (h > 24) { toast('A day can’t have more than 24 hours'); return; }
    if (!(r >= 0)) { toast('Enter an hourly rate'); return; }
    state.days[editing] = { h: round2(h), r: round2(r) };
    save(); render(); closeSheet(dayWrap);
    toast('Saved');
  });
  $('removeDay').addEventListener('click', () => {
    delete state.days[editing];
    save(); render(); closeSheet(dayWrap);
    toast('Removed');
  });

  // Settings sheet
  const setWrap = $('settingsWrap');
  $('openSettings').addEventListener('click', () => {
    $('defaultRate').value = state.rate.toFixed(2);
    openSheet(setWrap);
  });
  $('saveSettings').addEventListener('click', () => {
    const r = parseNum($('defaultRate').value);
    if (!(r >= 0)) { toast('Enter an hourly rate'); return; }
    state.rate = round2(r);
    save(); closeSheet(setWrap);
  });

  $('exportBtn').addEventListener('click', async () => {
    const name = `shifts-backup-${keyOf(today.y, today.m, today.d)}.json`;
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const file = new File([blob], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async ev => {
    const f = ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || typeof d.days !== 'object') throw new Error();
      const n = Object.keys(d.days).length;
      if (!confirm(`Replace what’s on this phone with the backup (${n} days logged)?`)) return;
      state = { rate: Number(d.rate) || 15, days: d.days };
      save(); render(); closeSheet(setWrap);
      toast('Backup restored');
    } catch (e) {
      toast('That file isn’t a Shifts backup');
    }
  });

  // ---------- Month navigation ----------
  function shift(delta) {
    const d = new Date(view.y, view.m + delta, 1);
    view = { y: d.getFullYear(), m: d.getMonth() };
    render();
  }
  $('prev').addEventListener('click', () => shift(-1));
  $('next').addEventListener('click', () => shift(1));
  $('monthName').addEventListener('click', () => { view = { y: today.y, m: today.m }; render(); });

  // Swipe left/right on the calendar to change month
  let sx = null, sy = null;
  $('grid').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('grid').addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shift(dx < 0 ? 1 : -1);
    sx = null;
  });

  // ---------- Toast ----------
  let tt;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // Re-check "today" when the app comes back to the foreground
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const n = new Date();
    if (n.getDate() !== today.d || n.getMonth() !== today.m) location.reload();
  });

  render();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js');
  }
})();
</script>
</body>
</html>
